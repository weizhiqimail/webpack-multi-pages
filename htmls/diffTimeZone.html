<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>不同时区时间对比</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.css" rel="stylesheet" />
    <script src="https://cdn.bootcdn.net/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }

      .panel-heading {
        font-size: 30px;
        text-align: center;
      }

      .panel-heading-title {
        padding-right: 12px;
      }

      #timeZoneList {
        width: 550px;
      }

      .area-item {
        padding: 6px 0;
        font-size: 26px;
        display: flex;
      }

      .area-name {
        width: 200px;
      }

      .area-time {
        width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel panel-primary">
        <div class="panel-heading">
          <span class="panel-heading-title">不同时区的时间</span>
          <span id="localTime"></span>
        </div>

        <div class="panel-body">
          <div id="timeZoneList"></div>
        </div>
      </div>
    </div>
    <script>
      const TIME_ZONE_LIST = [
        {
          areaName: '伦敦',
          offset: 0,
        },
        {
          areaName: '北京',
          offset: 8,
        },
        {
          areaName: '美国东部',
          offset: -5,
        },
        {
          areaName: '美国中部',
          offset: -6,
        },
        {
          areaName: '美国西部',
          offset: -7,
        },
        {
          areaName: '太平洋',
          offset: -8,
        },
      ];

      const TIME_FORMAT = 'YYYY-MM-DD HH:mm';

      const timeZoneListDom = document.getElementById('timeZoneList');

      function setDiffZoneTime() {
        timeZoneListDom.innerHTML = '';
        TIME_ZONE_LIST.forEach((timeZoneItem) => {
          const { areaName, offset } = timeZoneItem;
          const areaDom = document.createElement('p');
          areaDom.setAttribute('class', 'area-item');
          const time = moment(new Date()).utcOffset(offset).format(TIME_FORMAT);
          areaDom.innerHTML = `<span class="area-name">${areaName}：</span><span class="area-time">${time}</span>`;
          timeZoneListDom.appendChild(areaDom);
        });
      }

      function setPanelTitleTime() {
        const localTimeDom = document.getElementById('localTime');
        localTimeDom.innerText = moment(new Date()).format('YYYY-MM-DD HH:mm:ss');
      }

      setPanelTitleTime();

      setInterval(() => {
        setPanelTitleTime();
      }, 1000);

      setDiffZoneTime();

      setInterval(() => {
        setDiffZoneTime();
      }, 1000 * 60);
    </script>
  </body>
</html>
